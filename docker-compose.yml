# Arranque local reproducible. Todo queda ligado a 127.0.0.1: nada de esto se
# expone a internet salvo que se cambie a conciencia.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: baseball
      POSTGRES_PASSWORD: ${BU_DB_PASSWORD:-baseball_local}
      POSTGRES_DB: baseball_universe
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baseball -d baseball_universe"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      BU_DATABASE_URL: postgresql+psycopg://baseball:${BU_DB_PASSWORD:-baseball_local}@db:5432/baseball_universe
      BU_HOST: 0.0.0.0
      BU_LOG_LEVEL: ${BU_LOG_LEVEL:-INFO}
      BU_CORS_ORIGINS: '["http://127.0.0.1:5173","http://localhost:5173"]'
      PYTHONPATH: /app:/app/backend
    # Migraciones y catálogo universitario antes de servir. El catálogo se lee
    # del fichero versionado que viaja en la imagen: no se descarga nada, así
    # que tarda segundos y no hace falta arrancarlo en segundo plano ni dejar
    # la API a medias mientras llega.
    command:
      - sh
      - -ec
      - |
        cd /app/backend
        alembic upgrade head
        cd /app
        python scripts/import_universities.py --ensure \
          || echo "AVISO: no se pudo importar el catálogo universitario; la API sigue disponible."
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./simulation:/app/simulation:ro
      - ./backend:/app/backend:ro
      - ./data:/app/data:ro

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      BU_API_URL: http://api:8000
      ORIGIN: http://127.0.0.1:5173
      PORT: "5173"
      # El sondeo hace fiable el HMR sobre Docker Desktop, WSL y montajes bind.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Se espera a que la API esté sana: si no, la primera pantalla que ve el
    # usuario es un error de conexión mientras corren las migraciones.
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  frontend_node_modules:
